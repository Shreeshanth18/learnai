services:
  - type: web
    name: learnai-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRAINER_EMAILS
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: learnai-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/learnai-platform build
    staticPublishPath: artifacts/learnai-platform/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: PORT
        value: "4173"
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://learnai-api-tmq7.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
